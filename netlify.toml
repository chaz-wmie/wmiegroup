[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "https://www.wmiegroup.com/*"
  to = "https://wmiegroup.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/about/index.html"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/services/index.html"
  to = "/services/"
  status = 301

[[redirects]]
  from = "/services/*/index.html"
  to = "/services/:splat/"
  status = 301

[[redirects]]
  from = "/industries/index.html"
  to = "/industries/"
  status = 301

[[redirects]]
  from = "/leadership/index.html"
  to = "/leadership/"
  status = 301

[[redirects]]
  from = "/contact/index.html"
  to = "/contact/"
  status = 301
